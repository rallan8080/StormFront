# Local development stack for StormFront.
#
# This base file holds only the shared services (mongo, redis, client). The
# `server` service — either the Python/FastAPI or Node/NestJS backend — lives
# in a sibling file and is selected explicitly:
#
#   # Python, prod-ish
#   docker compose -f docker-compose.yml -f docker-compose.python.yml up --build
#   # Python, hot reload
#   docker compose -f docker-compose.yml -f docker-compose.python.yml -f docker-compose.python.override.yml up --build
#   # Node, prod-ish
#   docker compose -f docker-compose.yml -f docker-compose.node.yml up --build
#   # Node, hot reload
#   docker compose -f docker-compose.yml -f docker-compose.node.yml -f docker-compose.node.override.yml up --build
#
# Copy .env.example to .env and set JWT_SECRET before any of the above.
#
# Services:
#   mongo   MongoDB 7, persists to a named volume
#   redis   Redis 7, reserved for cross-process WS fan-out
#   server  Backend, from docker-compose.python.yml or docker-compose.node.yml
#   client  React/Vite app, depends on server

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build:
      context: ./client
      target: runtime
    depends_on:
      - server
    # Port mapping intentionally lives in the *.override.yml files so the
    # dev stage's 5173:5173 doesn't have to fight the prod stage's 5173:80
    # via Compose's list-merge semantics. A separate prod compose file can
    # publish 5173:80 (or 80:80) when there is one.
    restart: unless-stopped

volumes:
  mongo-data:
